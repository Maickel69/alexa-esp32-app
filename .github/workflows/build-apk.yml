name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/Alexa_ESP32.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Alexa ESP32 v1.0.${{ github.run_number }}"
          body: |
            ## Actualizacion Automatica de Alexa ESP32
            - Compilacion automatica generada por GitHub Actions.
            - Compatible con auto-actualizacion in-app en Android.
          files: release_assets/Alexa_ESP32.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
